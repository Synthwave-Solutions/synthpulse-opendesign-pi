<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="application-name" content="OpenDesign Studio">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpenDesign">
<link rel="manifest" href="/design/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/design/icons/icon-192.png">
<link rel="apple-touch-icon" href="/design/icons/icon-192.png">
<title>OpenDesign Studio | Synthwave</title>
<style>
  :root {
    --navy: #0f172a; --navy2: #1e293b; --panel: #162033; --line: #2d4057;
    --blue: #009dff; --text: #e8eef7; --muted: #8aa0bd;
    --wave-grad: linear-gradient(135deg, hsl(195 100% 60%) 0%, hsl(210 100% 50%) 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif; background: var(--navy);
    color: var(--text); display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--navy2); border-bottom: 3px solid var(--blue); flex: 0 0 auto;
  }
  header .logo { width: 30px; height: 30px; flex: 0 0 30px; }
  header .wordmark { display: flex; align-items: baseline; gap: 0; }
  header .wordmark .sw { font-size: 16px; font-weight: bold; letter-spacing: -.3px; color: var(--text); }
  header .wordmark .studio { font-size: 11px; letter-spacing: 2.5px; font-weight: bold; color: var(--blue); margin-left: 8px; text-transform: uppercase; }
  header .sub { color: var(--muted); font-size: 11px; margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--line); }
  header .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  /* sidebar */
  aside {
    width: 230px; flex: 0 0 auto; background: var(--navy2); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 12px;
  }
  aside h2 { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin: 4px 4px 10px; text-transform: uppercase; }
  .proj {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; transition: all .15s;
  }
  .proj:hover { background: var(--panel); border-color: var(--line); }
  .proj.active { background: var(--panel); border-color: var(--blue); box-shadow: 0 0 0 1px rgba(0,157,255,.15); }
  .proj .nm { font-size: 13px; font-weight: bold; }
  .proj .ct { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .proj .busy { color: var(--blue); }
  button, .btn {
    background: var(--blue); border: 0; color: #fff; font: inherit; font-size: 13px;
    padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: opacity .12s;
  }
  button:hover:not(:disabled) { opacity: .88; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: normal; }
  button.ghost:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); opacity: 1; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  /* center */
  .center { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .center .bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); background: var(--navy2); font-size: 12px; color: var(--muted);
  }
  .center .bar a { color: var(--blue); text-decoration: none; }
  iframe { flex: 1 1 auto; border: 0; background: #f0f0f0; width: 100%; }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); flex-direction: column; gap: 12px; }
  .empty[hidden] { display: none; }
  .empty .wave-icon { width: 48px; height: 48px; opacity: .35; }
  .empty .e-title { font-size: 14px; color: var(--text); }
  /* chat */
  .chat {
    width: 390px; flex: 0 0 auto; border-left: 1px solid var(--line); background: var(--navy2);
    display: flex; flex-direction: column; min-height: 0;
  }
  .chat .head { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .chat .head::before { content: ''; display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 6px var(--blue); }
  .msgs { flex: 1 1 auto; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msgs { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .msg { max-width: 92%; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 3px; }
  .msg.agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 3px; color: var(--muted); }
  .msg.agent.ok { color: var(--text); }
  .msg .tag { display: inline-block; font-size: 10px; letter-spacing: 1px; padding: 2px 7px; border-radius: 99px; margin-bottom: 6px; }
  .tag.run { background: rgba(0,157,255,.15); color: var(--blue); }
  .tag.done { background: rgba(46,204,113,.15); color: #2ecc71; }
  .tag.fail { background: rgba(231,76,60,.15); color: #e74c3c; }
  .composer { padding: 10px 12px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
  .composer textarea {
    width: 100%; resize: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font: inherit; font-size: 13px; padding: 10px 12px; min-height: 72px; height: 88px;
    outline: none; line-height: 1.5; transition: border-color .15s;
  }
  .composer textarea:focus { border-color: var(--blue); }
  .composer-row { display: flex; gap: 7px; align-items: center; }
  .uploads-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 2px; }
  .uploads-row[hidden] { display: none; }
  .file-chip {
    display: flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 99px; color: var(--muted);
  }
  .file-chip .rm { cursor: pointer; color: var(--blue); font-size: 13px; line-height: 1; padding: 0 2px; }
  .upload-btn { font-size: 15px; padding: 7px 11px; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; }
  .upload-btn:hover { border-color: var(--blue); color: var(--blue); opacity: 1; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--blue); border-top-color: transparent; border-radius: 50%; animation: sp 1s linear infinite; vertical-align: -1px; margin-right: 6px; }
  .xbtn { padding: 5px 10px; font-size: 12px; margin-left: 4px; }
  .xbtn.busy { opacity: .5; pointer-events: none; }
  #exportBar[hidden] { display: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  dialog { background: var(--navy2); color: var(--text); border: 1px solid var(--line); border-top: 3px solid var(--blue); border-radius: 12px; padding: 22px; width: 340px; box-shadow: 0 24px 64px rgba(0,0,0,.6); }
  dialog::backdrop { background: rgba(0,0,0,.7); backdrop-filter: blur(2px); }
  dialog input { width: 100%; margin: 12px 0 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font: inherit; padding: 10px; outline: none; transition: border-color .15s; }
  dialog input:focus { border-color: var(--blue); }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>

      <span style="flex:1"></span>
      <span id="exportBar" hidden>
        <span id="exportLabel" style="margin-right:6px;font-size:11px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <button class="ghost xbtn" data-fmt="pdf">PDF</button>
        <button class="ghost xbtn" data-fmt="pptx">PPTX</button>
        <button class="ghost xbtn" data-fmt="docx">DOCX</button>
        <button class="ghost xbtn" data-fmt="html">ZIP</button>
      </span>
    </div>
    <iframe id="frame" hidden></iframe>
    <div class="empty" id="empty">
      <svg class="wave-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="empty-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="hsl(195, 100%, 60%)"/>
            <stop offset="100%" stop-color="hsl(210, 100%, 50%)"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="21" fill="none" stroke="url(#empty-grad)" stroke-width="2.4" opacity="0.45"/>
        <path d="M14 30c2.8-5 7-7 10-3.5 2.4 2.8 6 2.2 8.5-1.5" fill="none" stroke="url(#empty-grad)" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M15.5 19c2.5-3.7 5.8-3.2 8.2-.6 2.6 2.9 6.4 1.4 9-2.6" fill="none" stroke="url(#empty-grad)" stroke-width="3.2" stroke-linecap="round" opacity="0.85"/>
      </svg>
      <div class="e-title">Selecteer of maak een project</div>
      <div style="font-size:12px">Beschrijf rechts wat je wilt designen</div>
    </div>
  </div>
  <div class="chat">
    <div class="head">Design Chat</div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <div class="uploads-row" id="uploadsRow" hidden></div>
      <textarea id="prompt" placeholder="Beschrijf je design... (Enter = verstuur, Shift+Enter = nieuwe regel)"></textarea>
      <div class="composer-row">
        <input type="file" id="fileInput" style="display:none" multiple>
        <button class="upload-btn" id="uploadBtn" title="Bestanden uploaden">&#128206;</button>
        <select id="engine" class="ghost" title="Routergroep" style="flex:1;padding:7px 8px;font-size:12px">
          <option value="omniroute">Synthwave Auto (OmniRoute)</option>
        </select>
        <button id="send">&#9658; Verstuur</button>
      </div>
    </div>
  </div>
</main>

<dialog id="projDlg">
  <div style="font-weight:bold">Nieuw project</div>
  <input id="projName" placeholder="bijv. Quickscan Landing">
  <div class="row">
    <button class="ghost" id="projCancel">Annuleer</button>
    <button id="projCreate">Aanmaken</button>
  </div>
</dialog>
<dialog id="keyDlg">
  <div style="font-weight:bold">API key</div>
  <div style="font-size:12px;color:var(--muted);margin-top:6px">Plak de OpenDesign Studio key (eenmalig).</div>
  <input id="keyInput" placeholder="key">
  <div class="row"><button id="keySave">Opslaan</button></div>
</dialog>

<script>
// Behind a path-mounted reverse proxy (e.g. Tailscale Funnel /design) relative
// fetches only resolve correctly when the page URL ends in a slash. Force it so
// `api/...` calls land on the mounted app instead of the proxy root.
if (!location.pathname.endsWith('/')) {
  location.replace(location.pathname + '/' + location.search + location.hash);
}
const qs = new URLSearchParams(location.search);
if (qs.get('key')) { localStorage.setItem('odkey', qs.get('key')); history.replaceState(null, '', location.pathname); }
let KEY = localStorage.getItem('odkey') || '';
let current = null;
let pollTimer = null;
let wasRunning = false;

const $ = id => document.getElementById(id);
const api = async (path, opts = {}) => {
  const r = await fetch('api/' + path, { ...opts, headers: { 'X-OD-Key': KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { $('keyDlg').showModal(); throw new Error('key'); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};

async function loadProjects() {
  const list = await api('projects');
  const box = $('projects');
  box.innerHTML = '';
  for (const p of list) {
    const el = document.createElement('div');
    el.className = 'proj' + (p.slug === current ? ' active' : '');
    el.innerHTML = `<div class="nm">${p.name}</div><div class="ct">${p.mockups} mockups, ${p.systems} systems ${p.running ? '<span class="busy">&bull; bezig</span>' : ''}</div>`;
    el.onclick = () => selectProject(p.slug, p.name);
    box.appendChild(el);
  }
  return list;
}

async function selectProject(slug, name) {
  current = slug;
  wasRunning = false;
  clearTimeout(pollTimer);
  selectedFile = null;
  $('exportBar').hidden = true;
  $('crumb').textContent = name || slug;
  $('empty').hidden = true;
  const f = $('frame');
  f.hidden = false;
  f.src = 'p/' + slug + '/?t=' + Date.now();
  await loadProjects();
  await renderJobs(true);
}

function msgEl(cls, html) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.innerHTML = html;
  return el;
}

function summarize(log) {
  if (!log) return '';
  const lines = log.trim().split('\n').filter(l => l.trim() && !l.startsWith('Loading extension') && !l.includes('API_KEY are set') && !l.includes('YOLO mode'));
  return lines.slice(-12).join('\n');
}

async function renderJobs(scroll) {
  if (!current) return;
  const jobs = await api('projects/' + current + '/jobs');
  const box = $('msgs');
  box.innerHTML = '';
  let anyRunning = false;
  for (const j of jobs) {
    box.appendChild(msgEl('user', escapeHtml(j.prompt || '')));
    if (j.status === 'running') {
      anyRunning = true;
      const d = await api('jobs/' + current + '/' + j.id).catch(() => j);
      box.appendChild(msgEl('agent', `<span class="tag run"><span class="spin"></span>BEZIG</span><br>${escapeHtml(summarize(d.log_tail) || 'Synthwave Auto is aan het ontwerpen...')}`));
    } else {
      const d = await api('jobs/' + current + '/' + j.id).catch(() => j);
      const ok = j.status === 'done';
      box.appendChild(msgEl('agent' + (ok ? ' ok' : ''), `<span class="tag ${ok ? 'done' : 'fail'}">${ok ? 'KLAAR' : 'MISLUKT'}</span><br>${escapeHtml(summarize(d.log_tail) || j.error || '')}`));
    }
  }
  if (scroll !== false) box.scrollTop = box.scrollHeight;
  $('send').disabled = anyRunning;
  // refresh the viewer the moment a job transitions running -> done
  if (wasRunning && !anyRunning) {
    $('frame').src = 'p/' + current + '/?t=' + Date.now();
    loadProjects();
  }
  wasRunning = anyRunning;
  clearTimeout(pollTimer);
  if (anyRunning) pollTimer = setTimeout(() => renderJobs(), 4000);
}

function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---- file uploads ----
let pendingUploads = []; // [{name, path}]

function refreshUploadsRow() {
  const row = $('uploadsRow');
  row.innerHTML = '';
  if (!pendingUploads.length) { row.hidden = true; return; }
  row.hidden = false;
  pendingUploads.forEach((f, i) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.innerHTML = `<span>&#128206; ${escapeHtml(f.name)}</span><span class="rm" data-i="${i}">&times;</span>`;
    chip.querySelector('.rm').onclick = () => { pendingUploads.splice(i, 1); refreshUploadsRow(); };
    row.appendChild(chip);
  });
}

async function uploadFiles(files) {
  if (!current) { alert('Selecteer eerst een project'); return; }
  $('uploadBtn').disabled = true;
  for (const file of files) {
    try {
      const r = await fetch(`api/projects/${current}/upload`, {
        method: 'POST',
        headers: { 'X-OD-Key': KEY, 'X-Filename': file.name, 'Content-Type': 'application/octet-stream' },
        body: file,
      });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || r.status); }
      const j = await r.json();
      pendingUploads.push({ name: j.name, path: j.path });
    } catch (e) { alert(`Upload mislukt (${file.name}): ${e.message}`); }
  }
  $('uploadBtn').disabled = false;
  refreshUploadsRow();
}

$('uploadBtn').onclick = () => { if (current) $('fileInput').click(); else alert('Selecteer eerst een project'); };
$('fileInput').onchange = e => { if (e.target.files.length) { uploadFiles(Array.from(e.target.files)); e.target.value = ''; } };

// drag-and-drop on the chat panel
document.querySelector('.chat').addEventListener('dragover', e => { e.preventDefault(); });
document.querySelector('.chat').addEventListener('drop', e => {
  e.preventDefault();
  const files = Array.from(e.dataTransfer.files);
  if (files.length) uploadFiles(files);
});

async function send() {
  let t = $('prompt').value.trim();
  if (!t || !current) return;
  if (pendingUploads.length) {
    t += '\n\n[Uploaded reference files in opendesign/uploads/: ' + pendingUploads.map(f => f.name).join(', ') + ']';
    pendingUploads = [];
    refreshUploadsRow();
  }
  $('prompt').value = '';
  try {
    const engine = ($('engine') || {}).value || 'omniroute';
    await api('projects/' + current + '/jobs', { method: 'POST', body: JSON.stringify({ prompt: t, engine }) });
  } catch (e) { alert(e.message); }
  renderJobs();
  loadProjects();
}

$('send').onclick = send;
$('prompt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('newProj').onclick = () => { $('projName').value = ''; $('projDlg').showModal(); $('projName').focus(); };
$('projCancel').onclick = () => $('projDlg').close();
$('projCreate').onclick = async () => {
  const name = $('projName').value.trim();
  if (!name) return;
  try {
    const r = await api('projects', { method: 'POST', body: JSON.stringify({ name }) });
    $('projDlg').close();
    await loadProjects();
    selectProject(r.slug, name);
  } catch (e) { alert(e.message); }
};
$('keySave').onclick = () => { KEY = $('keyInput').value.trim(); localStorage.setItem('odkey', KEY); $('keyDlg').close(); init(); };

// ---- export ----
let selectedFile = null;
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'od-file' && typeof e.data.path === 'string') {
    selectedFile = e.data.path.split('?')[0];
    const parts = selectedFile.split('/').filter(Boolean);
    // artifacts are all named index.html -> show the folder name instead
    const last = parts.pop() || selectedFile;
    const label = (/^index\.html?$/i.test(last) && parts.length) ? parts.pop() : last;
    $('exportLabel').textContent = label;
    $('exportBar').hidden = false;
  }
});
document.querySelectorAll('.xbtn').forEach(btn => {
  btn.onclick = async () => {
    if (!current || !selectedFile) return;
    btn.classList.add('busy');
    const orig = btn.textContent;
    btn.textContent = '...';
    try {
      const r = await fetch(`api/export/${current}/${btn.dataset.fmt}?path=${encodeURIComponent(selectedFile)}`, { headers: { 'X-OD-Key': KEY } });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || ('export faalde: ' + r.status)); }
      const blob = await r.blob();
      const cd = r.headers.get('Content-Disposition') || '';
      const fname = (cd.match(/filename="([^"]+)"/) || [])[1] || ('design.' + btn.dataset.fmt);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fname;
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) { alert(e.message); }
    btn.classList.remove('busy');
    btn.textContent = orig;
  };
});
$('openBtn').onclick = () => { if (current) window.open('p/' + current + '/', '_blank'); };

async function init() {
  try {
    const list = await loadProjects();
    if (list.length && !current) selectProject(list[0].slug, list[0].name);
  } catch (e) { /* key dialog already shown on 401 */ }
}
init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/design/service-worker.js', { scope: '/design/' })
      .catch(error => console.warn('[OpenDesign PWA] Service worker registration failed:', error));
  });
}
</script>
</body>
</html>
